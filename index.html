<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aquamarine;
            align-items: center;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }
        .game-container{
            width: 400px;
            height: 600px;
            background-color: white;
            border: 2px;
            border-color: black;
            border-radius: 7px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
            
  box-shadow: 0px 4px 10px rgba(2, 34, 47, 0.15);



        }
        .basket{
            position: absolute;
            left: 170px;
            height: 30px;
            width: 60px;
            background-color:goldenrod;
            bottom: 10px;
        }
        .data{
            padding: 10px;
           display: flex;
           justify-content: space-evenly;
           font-size: 18px;
           font-weight: bold;
           font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        .fall-item{
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background-color: rgb(6, 65, 65);
            position: absolute;
            left: 50px;
            top: 30px;
        }
        .btn{
            margin-top: 20px;
            display:flex;
            justify-content: space-between;
            gap: 30px;
            
        }
        
        button{
            padding: 10px 20px;
            border: none;
            background-color: goldenrod;
            color: antiquewhite;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
            font-size: 22px;
            font-weight: bold;
        }
        button:hover{
            background-color: antiquewhite;
            color: black;
        }
    </style>
</head>
<body>
    <div class="game-container">
       
        <div class="basket"></div>
        <div class="data">
             <p id="score">Score: 0</p>
            <p id="missed">Missed: 0</p>
        </div>
            
            <div class="fall-item"></div>
    </div>
     <audio id="scoresound" src="./Point Scored Paddle Game.mp3"></audio>
     <audio id="scoremissed" src="./Point Missed Paddle Game.mp3"></audio>
     <audio id="gameoversound" src="./Game Over Paddle Game.mp3"></audio>
    <div class="btn">

        <button onclick="left()"> <= </button>
        <button onclick="right()"> => </button>
       
    </div>
    <script>
       const basket = document.querySelector('.basket')
       const fallitem = document.querySelector('.fall-item')
       let score = 0 
       let scoredisplay = document.getElementById('score')
       let missed = 0
       let misseddisplay = document.getElementById('missed')
       let scoresound = document.getElementById('scoresound')
       let scoremissed = document.getElementById('scoremissed')
       let gameoversound = document.getElementById('gameoversound')

       let basketposition = 170




       function left(){
        if(basketposition>0){
              basketposition -= 20
                }
           basket.style.left = basketposition + 'px'
       }
       function right(){
        if(basketposition<340){
              basketposition += 20
                }
           basket.style.left = basketposition + 'px'
       }

            document.addEventListener('keydown',(event)=>{
                if (event.key==='ArrowLeft'&& basketposition > 0 ) {
                    basketposition -= 20
                } else if (event.key==='ArrowRight'&& basketposition < 340 ){
                    basketposition += 20
                }
                basket.style.left = basketposition + 'px'
            })
            
            

            function resetitem() {
                fallitem.style.top = '-50px'
                fallitem.style.left = Math.random()*370 + 'px'
            }
            function falldetect() {
                const basketrect = basket.getBoundingClientRect()
                 const fallitemrect = fallitem.getBoundingClientRect()
                 return !(
                    basketrect.top > fallitemrect.bottom || 
                    basketrect.bottom < fallitemrect.top ||
                    basketrect.left > fallitemrect.right ||
                     basketrect.right < fallitemrect.left
                 )
    
            }
            function gloop() {
                let falltop = parseInt(fallitem.style.top || '30');
                 falltop+=5;
                 fallitem.style.top = falltop +'px'
                 if (falltop > 550) {
                    missed++
                    scoremissed.play()
                    misseddisplay.textContent=`Missed: ${missed}`
                    if (missed===3) {
                         gameoversound.play()
                        alert(`Game Over! Your score was ${score}`)
                       
                        location.reload() 
                    }
                    resetitem()
                 } if (falldetect()) {
                    score++
                    scoresound.play()
                    scoredisplay.textContent='Score: '+ score

                    if (score %10===0) {
                        const colors = ["lightgreen","lightcoral","coral", "goldenrod", "lightorange", "lilac"]
                        const randomcolor = colors[Math.floor(Math.random()*colors.length)]

                        // document.querySelector('.game-container').style.background=randomcolor
                        document.body.style.background=randomcolor
                    }
                    resetitem()
                 }
                  requestAnimationFrame(gloop)
            }
         gloop()


          resetitem()
    </script>
</body>
</html>
